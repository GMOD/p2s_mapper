<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 76" width="720" height="76" role="img" aria-label="A gene name becomes a UniProt accession, then an AlphaFold model or a PDB entry">
<rect width="720" height="76" fill="#ffffff"/>
<defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect x="16" y="16" width="200" height="44" fill="#ffffff" stroke="#000000"/>
<text x="116" y="43" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#000000" text-anchor="middle">gene name</text>
<rect x="260" y="16" width="200" height="44" fill="#ffffff" stroke="#000000"/>
<text x="360" y="43" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#000000" text-anchor="middle">UniProt accession</text>
<line x1="220" y1="38" x2="256" y2="38" stroke="#000000" marker-end="url(#head)"/>
<rect x="504" y="16" width="200" height="44" fill="#ffffff" stroke="#000000"/>
<text x="604" y="43" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#000000" text-anchor="middle">AlphaFold or PDB structure</text>
<line x1="464" y1="38" x2="500" y2="38" stroke="#000000" marker-end="url(#head)"/>
</svg>
